[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nndbg"
version = "0.2.0"
description = "A modular mechanistic interpretability toolkit for PyTorch and HuggingFace models"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Darsh Nandu" }]

keywords = [
  "mechanistic-interpretability",
  "neural-networks",
  "explainability",
  "transformers",
  "probing",
  "activation-patching",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "torch>=2.1",
  "transformers>=4.38",
  "duckdb>=0.10",
  "scikit-learn>=1.4",
  "plotly>=5.20",
  "numpy>=1.26",
  "pandas>=2.2",
  "einops>=0.7",
  "tqdm>=4.66",
  "rich>=13.7",
  "typer>=0.12",
  "pydantic>=2.6",
]

[project.optional-dependencies]
attribution = [
  "captum>=0.7",
]
geometry = [
  "umap-learn>=0.5",
]
sae = [
  "transformer-lens>=1.14",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "mypy>=1.9",
  "pre-commit>=3.7",
  "ipykernel",
  "jupyter",
]
all = [
  "nndbg[attribution,geometry,sae,dev]",
]

[project.scripts]
nndbg = "nndbg.cli.main:app"

[project.urls]
Homepage = "https://github.com/Darsh-Nandu/neural-network-debugger"
Documentation = "https://nndbg.readthedocs.io"
Repository = "https://github.com/Darsh-Nandu/neural-network-debugger"
Issues = "https://github.com/Darsh-Nandu/neural-network-debugger/issues"

[tool.hatch.build.targets.wheel]
packages = ["nndbg"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=nndbg --cov-report=term-missing -v"

[tool.coverage.run]
omit = ["tests/*", "notebooks/*"]
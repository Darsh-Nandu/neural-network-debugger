[tool.poetry]
name = "nndbg"
version = "0.1.0"
description = "Deep semantic activation analysis for neural networks"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/yourusername/nndbg"
repository = "https://github.com/yourusername/nndbg"
keywords = ["deep-learning", "interpretability", "pytorch", "transformers", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
torch = ">=2.0.0"
transformers = ">=4.35.0"
duckdb = ">=0.9.0"
numpy = ">=1.24.0"
scikit-learn = ">=1.3.0"
plotly = ">=5.17.0"
rich = ">=13.0.0"
pyyaml = ">=6.0"
tqdm = ">=4.65.0"
ipywidgets = ">=8.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
pytest-cov = ">=4.1.0"
jupyter = ">=1.0.0"
black = ">=23.0.0"
ruff = ">=0.1.0"
mypy = ">=1.5.0"

[tool.poetry.scripts]
nndbg = "nndbg.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=nndbg --cov-report=term-missing"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nndbg"
version = "0.2.0"
description = "A focused, practical toolkit for diagnosing and interpreting neural networks: probing, attribution, attention, activation patching, sparse autoencoders, VAE latent analysis, CKA geometry, neuron analysis, and concept erasure."
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.10"
authors = [{ name = "Darsh Nandu" }]

keywords = [
  "interpretability",
  "mechanistic-interpretability",
  "neural-networks",
  "explainability",
  "transformers",
  "probing",
  "activation-patching",
  "sparse-autoencoder",
  "pytorch",
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

dependencies = [
  "torch>=2.1",
  "transformers>=4.40",
  "scikit-learn>=1.4",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "rich>=13.7",
]

[project.optional-dependencies]
plotly = [
  "plotly>=5.20",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
  "ipykernel",
  "jupyter",
]
all = [
  "nndbg[plotly,dev]",
]

[project.urls]
Homepage = "https://github.com/Darsh-Nandu/neural-network-debugger"
Repository = "https://github.com/Darsh-Nandu/neural-network-debugger"
Issues = "https://github.com/Darsh-Nandu/neural-network-debugger/issues"

[tool.hatch.build.targets.wheel]
packages = ["nndbg"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# X/Y are standard matrix names in ML; F = torch.nn.functional; P = projection matrix.
"nndbg/analysis/**/base.py" = ["N803", "N806", "N812"]
"nndbg/analysis/**/results.py" = ["N806"]
# umap import: PLC0415 = import-outside-top-level (intentional lazy optional dep)
"nndbg/analysis/geometry/base.py" = ["N803", "N806", "N812", "PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=nndbg --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*"]
